name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build
        env:
          VITE_BACKEND_URL: https://ai-dependency-system.onrender.com
          VITE_SUPABASE_URL: https://ltdmrgpvisfyrxwrwbev.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0ZG1yZ3B2aXNmeXJ4d3J3YmV2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk0OTQzMzksImV4cCI6MjA4NTA3MDMzOX0.JfzxrVUvucpVNyKSjU9OEVE8xKeKNTacN82BZVccnR4
        run: |
          cd frontend
          npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages
